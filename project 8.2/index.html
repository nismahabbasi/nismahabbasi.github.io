<html>
	<head>
		<title>
			class 13 demo
		</title>
		<meta name="viewport" content="width=device-width" /> 
		<!--- add link tag--->
		<link rel="stylesheet" href="style.css"/>
	</head>	
	<body>
		<p>
			i am so overstimulated today
		</p>
		<p>
			this is a second paragraph with the same style
		</p>
		<!--- add a p tag with a class-->
		<!--- class names cannot have spaces-->
		<p class="blue">
			this is a blue paragraph
		</p>
		<h1 class="blue">
			this is a blue h1
		</h1>
		<!-- generic inline group-->
		<span class="big purple">
			this is a big purple span
		</span>
		<span class="purple">
			this is a purple span
		</span>
		<span class="big">
			this is a big purple span
		</span>

		<!-- you can only use a singl eid name once -->
		<p id="important">
			this is important paragraph!!!
		</p>




	</body>
</html>
